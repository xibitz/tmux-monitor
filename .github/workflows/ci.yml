name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.3'
          cache: true
          cache-dependency-path: go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --prefix apps/web
      - run: go mod download
      - name: Build pinned tmux for isolated SSH integration tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential libevent-dev libncurses-dev bison pkg-config
          curl --fail --location --retry 3 https://github.com/tmux/tmux/releases/download/3.8/tmux-3.8.tar.gz -o "$RUNNER_TEMP/tmux.tar.gz"
          echo "e79c699c7e949dccd0a4a125e17b8d1261e311b16979dbc8eb34542f3966d82e  $RUNNER_TEMP/tmux.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/tmux.tar.gz" -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/tmux-3.8"
          ./configure --prefix="$RUNNER_TEMP/tmux-install"
          make -j2
          make install
          echo "$RUNNER_TEMP/tmux-install/bin" >> "$GITHUB_PATH"
      - name: Verify supported tmux version
        run: test "$(tmux -V)" = "tmux 3.8"
      - run: make check
      - run: make test
      - name: Verify isolated multi-client tmux sizing
        run: python3 scripts/tmux-spike.py
      - run: make build
      - name: Verify static Linux build
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o bin/hub-linux-amd64 ./cmd/hub
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: hub-linux-amd64
          path: bin/hub-linux-amd64
          if-no-files-found: error
